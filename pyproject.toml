[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "iMolpro"
description = "Graphical user interface to the Molpro quantum chemistry package"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.9"
dynamic = ["version"]
dependencies = [
    "pyside6<6.10",
    "pymolpro>=1.19.5",
    "pysjef>=1.45.9",
    "pubchempy>=1",
    "chemspipy>=2",
    "jsonschema>=4",
    "vtk",
    "lxml",
    "numpy",
    "ase",
    "pillow",
    "pikepdf",
]

[project.scripts]
iMolpro = "iMolpro.__main__:main"

[tool.setuptools_scm]
# Version is derived from git tags, matching the "git describe" logic
# previously duplicated in build.sh/build.ps1 and Chooser.py's version_().
#
# This repo has non-version tags lying around (e.g. "latest_2026_05_06_<hash>"
# from the tag-latest.yml workflow, or ad hoc tags like "windows-test") that
# git describe would otherwise pick up as the "nearest" tag and then fail to
# parse as a version. tag.strict below excludes any tag without a literal dot
# in it from consideration, which cleanly skips those. fallback_version is a
# safety net for the rare case where no matching tag is reachable at all (e.g.
# a very shallow clone).
fallback_version = "0.0.0"

[tool.setuptools_scm.tag]
strict = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
iMolpro = ["data/**/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
