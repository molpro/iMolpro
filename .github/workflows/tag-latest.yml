name: Tag latest

on:
  push:
    branches:
      - 'master'

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout branch "master"
        uses: actions/checkout@v7
        with:
          ref: 'master'
          token: ${{ secrets.PAT }}
      - name: tag
        id: tag
        run: |
          sha_short=$(git rev-parse --short HEAD)
          date=$(date +'%Y_%m_%d')
          tag=latest_${date}_${sha_short}
          echo "tag=${tag}" >> $GITHUB_OUTPUT
          git tag ${tag}
          git push --tags

    outputs:
      tag_name: ${{ steps.tag.outputs.tag }}

  clean:
    name: Clean obsolete latest
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - uses: actions/checkout@v7
      - name: Delete old latest releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # keep only the newest release whose tag contains "latest"
          gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | test("latest"))] | sort_by(.createdAt) | reverse | .[1:] | .[].tagName' |
          while read -r tag; do
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          done
