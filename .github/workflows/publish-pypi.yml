name: Publish to TestPyPI

# Triggered whenever a GitHub Release is published. Your repo's deploy.yml
# creates a release for *every* tag push, including the auto-generated
# "latest_YYYY_MM_DD_<sha>" tags and ad hoc tags like "windows-test-1" or
# "mcs07-2" — none of those are real version tags, so the "check-version-tag"
# job below only lets the build/publish jobs run when the release tag looks
# like a version number (e.g. "0.1.2", "2025.4.1"). Also runnable by hand via
# workflow_dispatch for testing.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  check-version-tag:
    runs-on: ubuntu-latest
    outputs:
      is_version: ${{ steps.check.outputs.is_version }}
    steps:
      - name: Check tag looks like a version
        id: check
        run: |
          tag="${{ github.event.release.tag_name }}"
          if [ -z "$tag" ]; then
            # workflow_dispatch has no release tag_name; allow it through
            echo "is_version=true" >> "$GITHUB_OUTPUT"
          elif [[ "$tag" =~ ^v?[0-9]+(\.[0-9]+)+$ ]]; then
            echo "is_version=true" >> "$GITHUB_OUTPUT"
          else
            echo "Tag '$tag' doesn't look like a version tag, skipping publish."
            echo "is_version=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check-version-tag
    if: needs.check-version-tag.outputs.is_version == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed so setuptools_scm can see tags

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tool
        run: python -m pip install --upgrade build

      - name: Build sdist and wheel
        run: python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/imolpro
    permissions:
      id-token: write   # required for OIDC trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  # Once you're ready to publish real releases to pypi.org, uncomment this
  # job (and consider adding a "required reviewers" protection rule on the
  # "pypi" environment in GitHub repo settings so publishes need manual
  # approval). It needs its own trusted publisher registered on pypi.org
  # (see setup notes) — the testpypi one above does not carry over.
  #
  # publish-pypi:
  #   needs: build
  #   runs-on: ubuntu-latest
  #   environment:
  #     name: pypi
  #     url: https://pypi.org/p/imolpro
  #   permissions:
  #     id-token: write
  #   steps:
  #     - uses: actions/download-artifact@v4
  #       with:
  #         name: dist
  #         path: dist/
  #     - uses: pypa/gh-action-pypi-publish@release/v1
